
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Online Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #222;
}

/* Navigation */
header {
    background: #172554;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
}

.cart-btn {
    background: #f59e0b;
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

/* Hero */
.hero {
    background: linear-gradient(120deg, #1e3a8a, #6366f1);
    color: white;
    text-align: center;
    padding: 75px 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 25px;
}

.hero button {
    background: #f59e0b;
    padding: 13px 25px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

/* Products */
.container {
    padding: 45px 7%;
}

.section-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 25px;
}

.search-box {
    display: block;
    width: 100%;
    max-width: 450px;
    padding: 13px;
    margin: 0 auto 25px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.categories {
    text-align: center;
    margin-bottom: 30px;
}

.categories button {
    padding: 10px 17px;
    margin: 5px;
    border: none;
    background: #dbeafe;
    border-radius: 20px;
    cursor: pointer;
}

.categories button:hover,
.categories button.active {
    background: #1e3a8a;
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000012;
    transition: 0.3s;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 210px;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 10px;
}

.price {
    color: #1e40af;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-btn {
    width: 100%;
    padding: 12px;
    background: #1e3a8a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.add-btn:hover {
    background: #2563eb;
}

/* Cart */
.cart-section {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.cart-content {
    background: white;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 10px;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close-btn {
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 12px 0;
    gap: 10px;
}

.quantity button {
    padding: 5px 10px;
    cursor: pointer;
}

.remove-btn {
    color: red;
    border: none;
    background: none;
    cursor: pointer;
    margin-left: 8px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin: 20px 0;
}

.checkout-btn {
    width: 100%;
    padding: 14px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.empty {
    text-align: center;
    padding: 20px;
}

/* Footer */
footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

@media(max-width:600px) {
    header {
        justify-content: center;
    }

    nav {
        text-align: center;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- Navigation -->
<header>
    <div class="logo">ShopEase 🛍️</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#footer">Contact</a>
    </nav>

    <button class="cart-btn" onclick="openCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>
</header>

<!-- Hero Section -->
<section class="hero" id="home">
    <h1>Welcome to ShopEase</h1>
    <p>Discover amazing products at the best prices!</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
        Shop Now
    </button>
</section>

<!-- Products Section -->
<section class="container" id="products">

    <h2 class="section-title">Our Products</h2>

    <input
        type="text"
        class="search-box"
        id="search"
        placeholder="Search products..."
        oninput="displayProducts()"
    >

    <div class="categories">
        <button class="active" onclick="filterCategory('All',this)">All</button>
        <button onclick="filterCategory('Electronics',this)">Electronics</button>
        <button onclick="filterCategory('Fashion',this)">Fashion</button>
        <button onclick="filterCategory('Accessories',this)">Accessories</button>
    </div>

    <div class="products" id="product-list"></div>

</section>

<!-- Shopping Cart -->
<div class="cart-section" id="cart-modal">
    <div class="cart-content">

        <div class="cart-header">
            <h2>🛒 Your Shopping Cart</h2>
            <button class="close-btn" onclick="closeCart()">×</button>
        </div>

        <div id="cart-items"></div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">
            Proceed to Checkout
        </button>

    </div>
</div>

<!-- Footer -->
<footer id="footer">
    <h3>ShopEase</h3>
    <p>Your favourite online shopping destination.</p>
    <p>Contact: support@shopease.com</p>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script>

// Product Details
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        category: "Electronics",
        price: 1499,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
    },
    {
        id: 2,
        name: "Smart Watch",
        category: "Electronics",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
    },
    {
        id: 3,
        name: "Running Shoes",
        category: "Fashion",
        price: 1999,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
    },
    {
        id: 4,
        name: "Men's T-Shirt",
        category: "Fashion",
        price: 699,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
    },
    {
        id: 5,
        name: "Sunglasses",
        category: "Accessories",
        price: 899,
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
    },
    {
        id: 6,
        name: "Backpack",
        category: "Accessories",
        price: 1299,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
    }
];

let cart = [];
let selectedCategory = "All";

// Display Products
function displayProducts() {

    const search = document.getElementById("search").value.toLowerCase();

    const filtered = products.filter(product => {
        return (
            (selectedCategory === "All" ||
            product.category === selectedCategory) &&
            product.name.toLowerCase().includes(search)
        );
    });

    const list = document.getElementById("product-list");

    if (filtered.length === 0) {
        list.innerHTML = "<p>No products found.</p>";
        return;
    }

    list.innerHTML = filtered.map(product => `
        <div class="product-card">
            <img src="${product.image}"
                 alt="${product.name}"
                 onerror="this.src='https://placehold.co/400x300?text=Product'">

            <div class="product-info">
                <h3>${product.name}</h3>
                <p>${product.category}</p>
                <div class="price">₹${product.price}</div>

                <button class="add-btn"
                    onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        </div>
    `).join("");
}

// Filter Products
function filterCategory(category, button) {

    selectedCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayProducts();
}

// Add Product to Cart
function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    updateCart();

    alert(product.name + " added to cart!");
}

// Update Cart
function updateCart() {

    const count = cart.reduce((sum, item) => sum + item.quantity, 0);

    document.getElementById("cart-count").innerText = count;

    const cartItems = document.getElementById("cart-items");

    if (cart.length === 0) {
        cartItems.innerHTML =
            '<p class="empty">Your cart is empty!</p>';
    } else {

        cartItems.innerHTML = cart.map(item => `
            <div class="cart-item">

                <div>
                    <strong>${item.name}</strong><br>
                    ₹${item.price} × ${item.quantity}
                </div>

                <div class="quantity">
                    <button onclick="changeQuantity(${item.id},-1)">-</button>
                    ${item.quantity}
                    <button onclick="changeQuantity(${item.id},1)">+</button>
                    <button class="remove-btn"
                        onclick="removeItem(${item.id})">Remove</button>
                </div>

            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("total").innerText = total;
}

// Change Quantity
function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
    }

    updateCart();
}

// Remove Product
function removeItem(id) {

    cart = cart.filter(item => item.id !== id);

    updateCart();
}

// Open Cart
function openCart() {
    document.getElementById("cart-modal").style.display = "flex";
    updateCart();
}

// Close Cart
function closeCart() {
    document.getElementById("cart-modal").style.display = "none";
}

// Demo Checkout
function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Thank you for shopping with ShopEase! This is a demo checkout. No payment was processed.");

    cart = [];
    updateCart();
    closeCart();
}

// Initial Display
displayProducts();
updateCart();

</script>

</body>
</html>
